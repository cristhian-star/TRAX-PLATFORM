<dialog class="whatsapp-consent-modal" data-whatsapp-consent-modal>
    <form method="dialog" class="whatsapp-consent-modal__content">
        <h2>Contacto por WhatsApp</h2>
        <p>
            Estas por comunicarte directamente con un profesional mediante WhatsApp.
            La conversacion se realizara fuera de TRAX.
        </p>
        <p>No compartas datos bancarios sensibles.</p>
        <label class="whatsapp-consent-modal__check">
            <input type="checkbox" data-whatsapp-consent-checkbox>
            <span>Acepto continuar.</span>
        </label>
        <div class="whatsapp-consent-modal__actions">
            <button type="button" data-whatsapp-consent-cancel>Cancelar</button>
            <button type="button" data-whatsapp-consent-confirm disabled>Continuar</button>
        </div>
    </form>
</dialog>
