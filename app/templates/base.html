<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAX Marketplace</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="TRAX inicio">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="TRAX Logo">
            <span>TRAX</span>
        </a>

        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
        </button>

        <nav class="main-nav" aria-label="Navegacion principal">
            <a href="/resultados">Explorar</a>
            <a href="/buscar?servicio=&zona=">Buscar</a>
            <a href="/profesionales/nuevo">Vender servicios</a>
        </nav>

        <div class="header-actions">
            <a href="/resultados" class="ghost-link">Ver mercado</a>
            <a href="/profesionales/nuevo" class="nav-cta">Empezar</a>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
        <strong>TRAX</strong>
        <span>Marketplace premium para servicios tecnicos.</span>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
