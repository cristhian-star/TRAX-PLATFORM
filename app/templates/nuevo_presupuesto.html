{% extends "base.html" %}

{% block content %}

<section class="form-section">
    <div class="section-container">
        <h2>Nuevo presupuesto</h2>
        <p class="form-helper">Solicita cotizaciones para comparar opciones antes de contratar.</p>

        {% if created %}
            <p class="form-alert">Solicitud de presupuesto creada correctamente.</p>
        {% endif %}

        {% set entry_data = form_data|default({}) %}
        <form action="/presupuestos/nuevo" method="POST" class="form-card">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input
                type="text"
                name="categoria"
                value="{{ entry_data.get('categoria', '') }}"
                placeholder="Categoria o rubro"
                required>

            <input
                type="text"
                name="zona"
                value="{{ entry_data.get('zona', '') }}"
                placeholder="Zona o localidad"
                required>

            <textarea
                name="descripcion"
                placeholder="Describe lo que necesitas"
                required>{{ entry_data.get('descripcion', '') }}</textarea>

            <button type="submit">Crear presupuesto</button>
        </form>
    </div>
</section>

{% endblock %}
