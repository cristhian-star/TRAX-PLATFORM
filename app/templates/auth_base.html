<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MANDOBRA Marketplace{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/branding/mandobra/mandobra-symbol-compact.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system-v2.css') }}">
    <script defer src="{{ url_for('static', filename='js/theme-switch-v1.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-switch-v1.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-ux-v1.css') }}">
</head>
<body class="auth-layout">
<div class="auth-utilities">
    <button class="theme-switch" type="button" data-theme-switch
            aria-label="Cambiar a tema oscuro" aria-pressed="false" hidden>
        <span class="theme-switch__track" aria-hidden="true"><span class="theme-switch__thumb"></span></span>
        <span class="theme-switch__label">Tema</span>
    </button>
</div>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='js/auth-ux-v1.js') }}"></script>
</body>
</html>
