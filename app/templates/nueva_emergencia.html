{% extends "base.html" %}

{% block content %}

<section class="form-section">
    <div class="section-container">
        <h2>Nueva emergencia</h2>
        <p class="form-helper">Registra una solicitud urgente para resolver un problema critico.</p>

        {% if created %}
            <p class="form-alert">Emergencia creada correctamente.</p>
        {% endif %}

        <form action="/emergencias/nueva" method="POST" class="form-card">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="categoria" placeholder="Categoria o rubro" required>

            <input type="text" name="zona" placeholder="Zona o localidad" required>

            <select name="prioridad" required>
                <option value="">Prioridad</option>
                <option>ALTA</option>
                <option>MEDIA</option>
                <option>BAJA</option>
            </select>

            <textarea name="descripcion" placeholder="Describe la emergencia" required></textarea>

            <button type="submit">Crear emergencia</button>
        </form>
    </div>
</section>

{% endblock %}
